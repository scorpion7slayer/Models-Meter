name: Build Models Meter APK

on:
  pull_request:
    branches: [main, alpha]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      GH_USERNAME: ${{ github.actor }}
      GH_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Install Android toolchain
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(awk -F'"' '/versionName = "/ { print $2; exit }' app/build.gradle.kts)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "::error::Unable to read versionName from android/app/build.gradle.kts"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$VERSION_NAME"
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION_NAME" == *-* ]]; then
            PRERELEASE=true
          fi
          # Channel invariant: alpha builds must reuse the newest stable versionCode so the
          # in-app "return to stable" install is never an Android downgrade, and stable
          # releases must strictly increase it.
          VERSION_CODE="$(awk '/versionCode = / { print $3; exit }' app/build.gradle.kts)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # Fork tags use a new applicationId. Inherited upstream tags are not releases of this app.
            APP_ID="$(awk -F'"' '/applicationId = "/ { print $2; exit }' app/build.gradle.kts)"
            LATEST_STABLE_TAG=""
            while IFS= read -r CANDIDATE; do
              CANDIDATE_APP_ID="$(git show "$CANDIDATE:android/app/build.gradle.kts" 2>/dev/null \
                | awk -F'"' '/applicationId = "/ { print $2; exit }' || true)"
              if [[ "$CANDIDATE_APP_ID" == "$APP_ID" ]]; then
                LATEST_STABLE_TAG="$CANDIDATE"
                break
              fi
            done < <(git tag -l 'v*' | grep -v -- - | grep -vx "$GITHUB_REF_NAME" | sort -Vr || true)
            if [[ -n "$LATEST_STABLE_TAG" ]]; then
              STABLE_CODE="$(git show "$LATEST_STABLE_TAG:android/app/build.gradle.kts" \
                2>/dev/null | awk '/versionCode = / { print $3; exit }' || true)"
              if [[ -z "$STABLE_CODE" ]]; then
                echo "::warning::Could not read versionCode from $LATEST_STABLE_TAG; skipping channel invariant check"
              elif [[ "$PRERELEASE" == "true" && "$VERSION_CODE" -ne "$STABLE_CODE" ]]; then
                echo "::error::Alpha tag $GITHUB_REF_NAME must keep versionCode $STABLE_CODE from $LATEST_STABLE_TAG (found $VERSION_CODE) so returning to stable stays an in-place install"
                exit 1
              elif [[ "$PRERELEASE" == "false" && "$VERSION_CODE" -le "$STABLE_CODE" ]]; then
                echo "::error::Stable tag $GITHUB_REF_NAME must raise versionCode above $STABLE_CODE from $LATEST_STABLE_TAG (found $VERSION_CODE)"
                exit 1
              fi
            fi
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./run-tests.sh

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail
          ./lint.sh

      - name: Configure persistent fork signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          MODELS_METER_KEYSTORE_BASE64: ${{ secrets.MODELS_METER_KEYSTORE_BASE64 }}
          MODELS_METER_SIGNING_PASSWORD: ${{ secrets.MODELS_METER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MODELS_METER_KEYSTORE_BASE64" || -z "$MODELS_METER_SIGNING_PASSWORD" ]]; then
            echo "::error::Configure MODELS_METER_KEYSTORE_BASE64 and MODELS_METER_SIGNING_PASSWORD repository secrets"
            exit 1
          fi
          umask 077
          mkdir -p .local-signing
          printf '%s' "$MODELS_METER_KEYSTORE_BASE64" | base64 --decode > .local-signing/models-meter-release.p12
          printf '%s' "$MODELS_METER_SIGNING_PASSWORD" > .local-signing/models-meter-password
          "$JAVA_HOME/bin/keytool" -list \
            -keystore .local-signing/models-meter-release.p12 \
            -storetype PKCS12 \
            -storepass:env MODELS_METER_SIGNING_PASSWORD \
            -alias modelsmeter >/dev/null

      - name: Build and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ./build.sh 2>&1 | tee dist/build.log

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: models-meter-${{ steps.version.outputs.name }}-ci
          path: |
            android/dist/ModelsMeter-${{ steps.version.outputs.name }}.apk
            android/dist/SHA256SUMS.txt
            android/dist/build.log
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release sources
        uses: actions/checkout@v7

      - name: Download verified APKs
        uses: actions/download-artifact@v8
        with:
          name: models-meter-${{ needs.build.outputs.version }}-ci
          path: release-dist

      - name: Verify release checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-dist
          sha256sum -c SHA256SUMS.txt

      - name: Prepare release notes
        shell: bash
        env:
          VERSION_NAME: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION_NAME" '
            $0 == "## " version || index($0, "## " version " —") == 1 {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no release notes for $VERSION_NAME"
            exit 1
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --prerelease="$PRERELEASE" \
              --notes-file release-notes.md \
              --title "Models Meter $VERSION_NAME"
          else
            gh release edit "$GITHUB_REF_NAME" \
              --prerelease="$PRERELEASE" \
              --notes-file release-notes.md \
              --title "Models Meter $VERSION_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "release-dist/ModelsMeter-$VERSION_NAME.apk#Models Meter $VERSION_NAME APK" \
            "release-dist/SHA256SUMS.txt#SHA-256 checksums" \
            --clobber
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
